<html lang="en">
<head>
<meta charset="utf-8" />

<title>AI Manufacturing Copilot · Pillar 2</title>
<style>
:root{--bg:#111315;--panel:#191c1f;--panel2:#202428;--line:#30363b;--text:#f1f2ee;--muted:#9ca5aa;--amber:#f3b544;--amber2:#ffcf70;--red:#ff6969;--green:#78d6a3;--blue:#8fc7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#252a2e;color:var(--text)}button:hover{border-color:var(--amber)}button.primary{background:var(--amber);border-color:var(--amber);color:#171717;font-weight:750}button.danger{border-color:#794343;color:#ffaaaa}button:disabled{opacity:.4;cursor:not-allowed}
.app{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--line);background:#151719;padding:22px 14px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;gap:11px;align-items:center;padding:0 8px}.logo{width:36px;height:36px;border-radius:10px;background:var(--amber);color:#171717;display:grid;place-items:center;font-weight:900;font-size:17px}.brand strong{display:block;letter-spacing:.02em}.brand small{color:var(--muted);font-size:11px}.section-label{font-size:10px;color:#747f85;letter-spacing:.16em;text-transform:uppercase;padding:0 10px;margin-bottom:8px}.nav{display:grid;gap:5px}.nav button{background:transparent;border-color:transparent;text-align:left;display:flex;align-items:center;gap:11px;color:#adb5b9;padding:11px 10px}.nav button.active{background:#2a261d;border-color:#55452a;color:var(--amber2)}.nav .ico{width:19px;text-align:center}.sidebar-foot{margin-top:auto;border-top:1px solid var(--line);padding:15px 8px 0;color:var(--muted);font-size:11px}.live-dot{display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:7px}
main{min-width:0}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:18px}.eyebrow{font-size:10px;color:var(--amber);letter-spacing:.15em;text-transform:uppercase}.topbar h1{font-size:19px;margin:2px 0 0}.top-right{display:flex;align-items:center;gap:10px}.demo-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber2);border:1px solid #6e552d;border-radius:6px;padding:5px 8px;background:#2a2419}.role-select{background:#202428;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px;max-width:190px}
.content{padding:26px 28px 40px;max-width:1500px;margin:auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}.page-head h2{font-size:24px;margin:0 0 5px}.sub{color:var(--muted);margin:0;max-width:760px}.grid{display:grid;gap:14px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.metric,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}.metric{padding:16px}.metric .label{color:var(--muted);font-size:12px}.metric .value{font-size:27px;font-weight:750;margin:7px 0 4px}.metric .foot{font-size:11px;color:var(--muted)}.up{color:var(--green)!important}.warn{color:var(--amber)!important}.critical{color:var(--red)!important}.two-col{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr)}.card{padding:18px;min-width:0}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.card h3{font-size:14px;margin:0}.card-head small{color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:5px;border:1px solid var(--line);padding:4px 7px;font-size:10px;text-transform:uppercase;letter-spacing:.05em}.pill.red{color:#ff9c9c;border-color:#784242;background:#2b1d1d}.pill.amber{color:var(--amber2);border-color:#6b542e;background:#2a2419}.pill.green{color:var(--green);border-color:#315b46;background:#1a2921}.incident{padding:14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#1c2023;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.incident.selected{border-color:#a57a2d;background:#29251d}.incident h4{font-size:13px;margin:7px 0 4px}.incident p{font-size:12px;color:var(--muted);margin:0}.incident .meta{font-size:10px;color:#879198}.incident-actions{display:flex;gap:6px;flex-wrap:wrap}.small-btn{padding:6px 8px;font-size:11px}.kv{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid #2b3034}.kv:last-child{border:0}.kv span:first-child{color:var(--muted)}.kv strong{font-weight:650;text-align:right}.bar{height:6px;background:#30363b;border-radius:9px;overflow:hidden;margin:8px 0 5px}.bar span{display:block;height:100%;background:var(--amber);border-radius:9px}.hypothesis{border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:9px}.hyp-title{display:flex;justify-content:space-between;gap:10px;font-weight:650;font-size:12px}.hypothesis p{color:var(--muted);font-size:11px;margin:7px 0}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:11px;color:var(--muted)}.field input,.field select,.field textarea{background:#111416;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}.field textarea{min-height:74px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.note{background:#242219;border:1px solid #544528;color:#d9c18e;border-radius:9px;padding:11px 13px;font-size:11px;margin-bottom:16px}.checklist{display:grid;gap:9px}.checkrow{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:12px;border-radius:9px}.checkrow input{accent-color:var(--amber);margin-top:3px}.checkrow span{display:block}.checkrow small{display:block;color:var(--muted);margin-top:3px}.timeline{display:grid;gap:0}.event{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.event time{color:var(--muted);font-size:11px}.event strong{font-size:12px}.event p{color:var(--muted);font-size:11px;margin:4px 0 0}.empty{padding:30px 15px;text-align:center;color:var(--muted)}.kb-card{border:1px solid var(--line);border-radius:10px;padding:15px;margin-bottom:10px}.kb-card h4{margin:8px 0;font-size:14px}.kb-card p{color:var(--muted);font-size:12px}.toast{position:fixed;right:22px;bottom:22px;background:#252a2e;border:1px solid #565f64;border-radius:10px;padding:12px 16px;max-width:340px;box-shadow:0 8px 30px #0008;z-index:10}.hidden{display:none!important}
@media(max-width:1000px){.app{grid-template-columns:70px minmax(0,1fr)}.sidebar{padding:18px 8px}.brand{padding:0;justify-content:center}.brand-text,.section-label,.nav .nav-text,.sidebar-foot{display:none}.nav button{justify-content:center;padding:12px 5px}.nav .ico{font-size:17px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}.content{padding:20px}.topbar{padding:0 20px}}
@media(max-width:620px){.topbar{height:auto;padding:16px;align-items:flex-start;flex-direction:column}.top-right{width:100%;justify-content:space-between}.content{padding:16px}.metrics{grid-template-columns:1fr 1fr}.metric{padding:12px}.metric .value{font-size:22px}.page-head{flex-direction:column}.form-row{grid-template-columns:1fr}.event{grid-template-columns:82px 1fr}}
</style>
<style>
/* Toyota-inspired prototype skin: supplied red/white/black/gray palette. */
:root{--bg:#fff;--panel:#fff;--panel2:#f5f5f5;--line:#d4d4d4;--text:#000;--muted:#58595b;--amber:#eb0a1e;--amber2:#eb0a1e;--red:#eb0a1e;--green:#58595b;--blue:#58595b}
body{background:var(--bg);color:var(--text)}
button{background:#fff;border-color:#58595b;color:#000;border-radius:2px}button:hover{border-color:#eb0a1e}button.primary{background:#eb0a1e;border-color:#eb0a1e;color:#fff}button.danger{border-color:#eb0a1e;color:#eb0a1e}
.sidebar{background:#000;border-right-color:#000}.brand strong{color:#fff}.brand small,.sidebar-foot{color:#d4d4d4}.sidebar-foot{border-top-color:#58595b}.logo{background:transparent;width:76px;height:48px;border-radius:0}.logo img{display:block;width:76px;height:48px;object-fit:contain}.logo-fallback{color:#fff;font-weight:800;font-size:13px;letter-spacing:.08em}.nav button{color:#e8e8e8}.nav button.active{background:#eb0a1e;border-color:#eb0a1e;color:#fff}.section-label{color:#b5b5b5}
.topbar{background:#fff;border-bottom:3px solid #eb0a1e}.eyebrow{color:#eb0a1e}.demo-label{color:#eb0a1e;border-color:#eb0a1e;background:#fff}.role-select{background:#fff;border-color:#58595b;color:#000}
.metric,.card{background:#fff;border-color:#d4d4d4;box-shadow:0 1px 2px #0000000d}.incident{background:#fff;border-color:#d4d4d4}.incident.selected{border-color:#eb0a1e;background:#fff5f5}.pill.red{color:#eb0a1e;border-color:#eb0a1e;background:#fff5f5}.pill.amber{color:#000;border-color:#58595b;background:#f5f5f5}.pill.green{color:#000;border-color:#58595b;background:#f5f5f5}.up,.warn,.critical{color:#eb0a1e!important}.note{background:#fff5f5;border-color:#eb0a1e;color:#000}.checkrow,.hypothesis,.kb-card{border-color:#d4d4d4;background:#fff}.field input,.field select,.field textarea{background:#fff;color:#000;border-color:#58595b}.bar{background:#e6e6e6}.bar span{background:#eb0a1e}.live-dot{background:#eb0a1e}.toast{background:#000;border-color:#eb0a1e;color:#fff}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo"><img src="assets/toyota-logo.svg" alt="Toyota" onerror="this.classList.add('hidden');this.nextElementSibling.classList.remove('hidden')"><span class="logo-fallback hidden">TOYOTA</span></div><div class="brand-text"><strong>TOYOTA</strong><small>MANUFACTURING COPILOT · PILLAR 2</small></div></div>
  <div><div class="section-label">Operations</div><nav class="nav" id="nav">
    <button class="active" data-page="command"><span class="ico">▦</span><span class="nav-text">Command Center</span></button>
    <button data-page="incidents"><span class="ico">◉</span><span class="nav-text">Incident Queue</span></button>
    <button data-page="diagnosis"><span class="ico">⌁</span><span class="nav-text">Diagnosis</span></button>
    <button data-page="tasks"><span class="ico">☷</span><span class="nav-text">Action Tasks</span></button>
    <button data-page="verification"><span class="ico">✓</span><span class="nav-text">Verification</span></button>
  </nav></div>
  <div><div class="section-label">Knowledge & Governance</div><nav class="nav">
    <button data-page="knowledge"><span class="ico">▤</span><span class="nav-text">Knowledge Base</span></button>
    <button data-page="audit"><span class="ico">≋</span><span class="nav-text">Audit Trail</span></button>
  </nav></div>
  <div class="sidebar-foot"><span class="live-dot"></span>Demo environment<br><br>All displayed records are simulated.</div>
</aside>
<main>
<header class="topbar"><div><div class="eyebrow">Operations intelligence / Pillar 02</div><h1 id="topTitle">Command Center</h1></div><div class="top-right"><span class="demo-label">● SIMULATED DATA</span><select id="language" class="role-select" aria-label="Choose language"><option value="id">Bahasa Indonesia</option><option value="en">English</option></select><select id="role" class="role-select" aria-label="Choose role"><option>Process Engineer</option><option>Senior Engineer</option><option>Line Operator</option></select></div></header>
<div class="content" id="view"></div>
</main>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
// This prototype intentionally uses browser-memory state only. It never reads from
// or writes to a manufacturing system, database, PLC, MES, or CMMS.
const SIMULATION_LABEL = 'SIMULATED DATA · LOCAL DEMO ONLY';
const ROLES = Object.freeze({
 'Process Engineer': {canDecide:true, canSecondApprove:false, canValidateKnowledge:false},
 'Senior Engineer': {canDecide:true, canSecondApprove:true, canValidateKnowledge:true},
 'Line Operator': {canDecide:false, canSecondApprove:false, canValidateKnowledge:false}
});
const state = {
 page:'command', locale:'id', role:'Process Engineer', selected:'INC-2048', approved:false, modified:false, rejected:false,
 secondApproved:false, taskChecks:[false,false,false,false], verified:false, verificationFailed:false, kbValidated:false, replayed:false, replayInjected:false,
 operatorAck:false, operatorEscalated:false, operatorNote:'', events: [
  ['08:42:11','Incident detected','INC-2048 created from simulated quality signal.'],
  ['08:42:13','Evidence bundle assembled','Parameter trend, defect trend, and station metadata attached.'],
  ['08:43:02','AI diagnosis generated','Three hypotheses ranked for engineer review.']
 ]
};
const incidents=[
 {id:'INC-2048',title:'Sealer thickness below spec',line:'Line 03 · Station A-12',model:'HEV-X',severity:'Critical',status:'Needs review',age:'4 min ago'},
 {id:'INC-2047',title:'Cycle time variance detected',line:'Line 02 · Station B-04',model:'HEV-X',severity:'Warning',status:'Monitoring',age:'12 min ago'}
];
const titles={command:'Command Center',incidents:'Incident Queue',diagnosis:'Diagnosis',tasks:'Action Tasks',verification:'Verification',knowledge:'Knowledge Base',audit:'Audit Trail'};
const translations = Object.freeze({
 'Command Center':'Pusat Kendali','Incident Queue':'Antrean Insiden','Diagnosis':'Diagnosis','Action Tasks':'Tindakan Perbaikan','Verification':'Verifikasi Hasil','Knowledge Base':'Basis Pengetahuan','Audit Trail':'Riwayat Aktivitas',
 'Operations':'Operasional','Knowledge & Governance':'Pengetahuan & Tata Kelola','Production overview':'Ringkasan produksi','Review incidents →':'Tinjau insiden →','Open incident queue':'Buka antrean insiden','Priority incidents':'Insiden prioritas','Workflow status':'Status alur kerja',
 'Incident queue':'Antrean insiden','Active incidents':'Insiden aktif','Selected incident':'Insiden terpilih','Open diagnosis →':'Buka diagnosis →','Diagnosis workspace':'Ruang diagnosis','Human review required':'Tinjauan manusia diperlukan','Engineer approved':'Disetujui engineer',
 'Recommended action':'Rekomendasi tindakan','Advisory':'Saran','Approve recommendation':'Setujui rekomendasi','Modify & approve':'Ubah & setujui','Reject':'Tolak','Grant second approval':'Berikan persetujuan kedua','Go to action tasks →':'Ke tindakan perbaikan →',
 'Action tasks':'Tindakan perbaikan','Corrective action checklist':'Checklist tindakan perbaikan','Continue to verification →':'Lanjut ke verifikasi →','Execution guardrails':'Batasan pelaksanaan','Human-led':'Dikendalikan manusia',
 'Before / after comparison':'Perbandingan sebelum / sesudah','Run simulated verification':'Jalankan verifikasi simulasi','Verification evidence':'Bukti verifikasi','Capture knowledge →':'Simpan pengetahuan →',
 'Knowledge base':'Basis pengetahuan','Knowledge article':'Artikel pengetahuan','Validate article':'Validasi artikel','Validated':'Tervalidasi','Draft':'Draf','Replay retrieval':'Pengambilan ulang','Test retrieval eligibility':'Uji kelayakan pengambilan',
 'Export JSON':'Ekspor JSON','Activity log':'Log aktivitas','Data simulated':'Data simulasi','Simulated measurements':'Pengukuran simulasi','Critical':'Kritis','Warning':'Peringatan','In progress':'Sedang berjalan','Complete':'Selesai','Pending verification':'Menunggu verifikasi',
 'Open incidents':'Insiden terbuka','First pass yield':'First pass yield','Mean response time':'Rata-rata waktu respons','Knowledge articles':'Artikel pengetahuan','Production line':'Lini produksi','Product model':'Model produk','Signal':'Sinyal','Result':'Hasil','Pass':'Lulus','Not run':'Belum dijalankan',
 'Proposed setpoint (bar)':'Setpoint yang diusulkan (bar)','Decision note':'Catatan keputusan','View verification':'Lihat verifikasi','Article status':'Status artikel','Eligible for replay':'Layak untuk pengambilan ulang','No':'Tidak','Yes':'Ya',
 'Line Operator can acknowledge and escalate, but cannot approve engineering decisions.':'Line Operator dapat mengakui dan mengeskalasi, tetapi tidak dapat menyetujui keputusan engineering.','Only a Senior Engineer can validate this article.':'Hanya Senior Engineer yang dapat memvalidasi artikel ini.','Complete verification before this article can be validated.':'Selesaikan verifikasi sebelum artikel ini dapat divalidasi.'
});
function localizeInterface(){if(state.locale!=='id')return;document.documentElement.lang='id';let walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);let keys=Object.keys(translations).sort((a,b)=>b.length-a.length);nodes.forEach(node=>{let value=node.nodeValue;keys.forEach(key=>{value=value.split(key).join(translations[key])});node.nodeValue=value});document.querySelectorAll('[placeholder]').forEach(el=>{let value=el.getAttribute('placeholder');if(value==='Add rationale or conditions...')el.setAttribute('placeholder','Tambahkan alasan atau kondisi...');if(value==='Contoh: bunyi tidak normal terdengar pada nozzle...')el.setAttribute('placeholder','Contoh: bunyi tidak normal terdengar pada nozzle...')})}
function activeIncident(){return incidents.find(i=>i.id===state.selected)||incidents[0]}
function isCriticalIncident(){return activeIncident().severity==='Critical'}
function roleCapabilities(){return ROLES[state.role]}
function needsSecondApproval(){return isCriticalIncident()&&!state.secondApproved}
function isActionReady(){return state.approved&&!needsSecondApproval()}
function isVerificationReady(){return isActionReady()&&state.taskChecks.every(Boolean)}
function canValidateKnowledge(){return roleCapabilities().canValidateKnowledge&&state.verified}
function isOperator(){return state.role==='Line Operator'}
function hasEngineerAccess(){return !isOperator()}
function simulationNote(text='All values, evidence, approvals, results, and audit entries shown here are simulated locally in this browser.'){
 return `<div class="note">${SIMULATION_LABEL} · ${text}</div>`
}
function log(title,detail){const d=new Date();state.events.unshift([d.toLocaleTimeString('en-GB'),title,detail]);}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2600)}
function showEvidence(id){toast(`Simulated evidence source opened: ${id}. No production record is connected.`)}
function showSimilarCases(){toast('Simulated retrieval: 5 validated, closed cases ranked by similarity. Top match: KAIZEN-0881 (91%).')}
function escalateKaizen(){log('Kaizen review escalated','Recurring pressure-regulator drift flagged: 5 simulated occurrences in 30 days.');toast('Kaizen escalation recorded in the demo audit trail.')}
function renderDiagnosisEnhancements(){if(state.page!=='diagnosis'||!hasEngineerAccess())return;let card=document.querySelector('#view .grid.two-col .card');if(!card)return;let id=activeIncident().id;card.insertAdjacentHTML('beforeend',`<div class="note" style="margin-top:16px"><strong>Simulated parameter context:</strong> pressure −12%, temperature −4%, cycle time +7%; material lot M-77 changed within 60 min. Pressure deviation began 7 min before the defect. <button class="small-btn" onclick="showEvidence('EV-${id.slice(4)}-A')">Open EV-${id.slice(4)}-A</button></div><div class="card-head" style="margin-top:16px"><h3>Similar validated cases</h3><span class="pill green">8 found</span></div><div class="kv"><span>KAIZEN-0881 · Station A-12</span><strong>91% · regulator recalibration · effective</strong></div><div class="kv"><span>KAIZEN-0764 · Station A-09</span><strong>84% · nozzle inspection · effective</strong></div><div class="kv"><span>KAIZEN-0653 · Station A-12</span><strong>79% · pressure reset · effective</strong></div><button class="small-btn" style="margin-top:10px" onclick="showSimilarCases()">View top 5 simulated cases</button>`)}
function renderRecommendationDetails(){if(state.page!=='diagnosis'||!hasEngineerAccess())return;let card=document.querySelectorAll('#view .grid.two-col .card')[1];if(!card)return;card.insertAdjacentHTML('beforeend',`<div class="note" style="margin-top:14px"><strong>Recommended simulated steps:</strong> 1. Inspect regulator. 2. Check nozzle. 3. Apply approved setpoint within SOP 2.70–3.20 bar. 4. Run 3 validation units. Expected effect: defect rate below 1.5%. Confidence score: 0.78. Sources: KAIZEN-0881, KAIZEN-0764.</div>`)}
function renderTaskMetadata(){if(state.page!=='tasks')return;let card=document.querySelector('#view .grid.two-col .card');if(!card)return;let statuses=state.taskChecks.map(done=>done?'Done':'Open');card.insertAdjacentHTML('beforeend',`<div class="note" style="margin-top:14px"><strong>Task assignment · simulated:</strong><br>1. Line Operator · due 09:00 · ${statuses[0]}<br>2. Process Engineer · due 09:10 · ${statuses[1]}<br>3. Process Engineer · due 09:20 · ${statuses[2]}<br>4. Quality Engineer · due 09:35 · ${statuses[3]}</div>`)}
function renderVerificationControls(){if(state.page!=='verification'||state.verified)return;let card=document.querySelector('#view .grid.two-col .card');if(!card)return;card.insertAdjacentHTML('beforeend',`<div class="field" style="margin-top:14px"><label for="verificationScenario">Demo verification outcome</label><select id="verificationScenario" ${!isVerificationReady()?'disabled':''}><option value="effective">Effective · 1.1% defect rate</option><option value="failed">Not effective · return to diagnosis</option></select></div><p class="sub" style="font-size:11px">This control exercises the PRD failure path using simulated data only.</p>`)}
function renderFailedFixEvidence(){if(state.page!=='diagnosis'||!state.verificationFailed)return;let card=document.querySelector('#view .grid.two-col .card');if(card)card.insertAdjacentHTML('afterbegin',`<div class="note"><strong>Failed-fix evidence · simulated:</strong> Verification did not bring the defect rate within the 1.5% control limit. The incident has returned to Diagnosis for a new engineer decision.</div>`)}
function renderReplayInjection(){if(state.page!=='knowledge'||!state.replayInjected)return;let card=document.querySelectorAll('#view .grid.two-col .card')[1];if(card)card.insertAdjacentHTML('beforeend',`<div class="note" style="margin-top:12px"><strong>Replay complete · simulated:</strong> A new repeat pattern was injected into the local demo. KAIZEN-1042 is the top similar case (94% similarity), demonstrating validated-knowledge reuse without any live ingestion or AI service.</div>`)}
function incidentWorkflowState(){if(state.kbValidated)return 'KNOWLEDGE_SAVED';if(state.verified)return 'RESOLVED';if(state.taskChecks.some(Boolean))return 'IN_ACTION';if(state.approved)return needsSecondApproval()?'AWAITING_SECOND_APPROVAL':'IN_ACTION';return state.verificationFailed||state.rejected?'DIAGNOSING':'AWAITING_DECISION'}
function renderIncidentState(){if(state.page!=='incidents'||isOperator())return;let card=document.querySelectorAll('#view .grid.two-col .card')[1];if(card)card.insertAdjacentHTML('beforeend',`<div class="note" style="margin-top:14px"><strong>Simulated workflow state:</strong> ${incidentWorkflowState()}. Allowed next action is controlled by the local demo workflow.</div>`)}
function go(p){state.page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('topTitle').textContent=titles[p];render()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
document.getElementById('role').addEventListener('change',e=>{state.role=e.target.value;if(isOperator()&&!['command','incidents'].includes(state.page))state.page='incidents';document.getElementById('topTitle').textContent=titles[state.page];log('Role changed',`Active demo role: ${state.role}`);render();toast(`View changed to ${state.role}`)});
document.getElementById('language').addEventListener('change',e=>{state.locale=e.target.value;render();toast(state.locale==='id'?'Bahasa Indonesia digunakan sebagai bahasa tampilan.':'English is now used as the display language.')});
function applyRoleNavigation(){document.querySelectorAll('[data-page]').forEach(button=>{let restricted=isOperator()&&!['command','incidents'].includes(button.dataset.page);button.classList.toggle('hidden',restricted);button.classList.toggle('active',button.dataset.page===state.page)})}
function metrics(){return `<div class="grid metrics">
<div class="metric"><div class="label">Open incidents</div><div class="value">07</div><div class="foot"><span class="critical">2 critical</span> · 5 warning · updated 1 min ago</div></div>
<div class="metric"><div class="label">Selected line · defect rate</div><div class="value critical">4.8<span style="font-size:14px">%</span></div><div class="foot">Line 03 · Shift A · updated 1 min ago</div></div>
<div class="metric"><div class="label">First pass yield</div><div class="value">96.2<span style="font-size:14px">%</span></div><div class="foot">Line 03 · Shift A · simulated</div></div>
<div class="metric"><div class="label">OEE</div><div class="value">82.4<span style="font-size:14px">%</span></div><div class="foot">Line 03 · Shift A · simulated</div></div>
<div class="metric"><div class="label">MTTR</div><div class="value">18<span style="font-size:14px"> min</span></div><div class="foot">Illustrative demo metric · updated 2 min ago</div></div>
<div class="metric"><div class="label">Knowledge articles</div><div class="value">24</div><div class="foot">1 awaiting validation · simulated</div></div></div>`}
function incidentCard(i){let meta=i.id==='INC-2048'?'AI confidence 0.78 · Owner: R. Pratama':'AI confidence 0.62 · Owner: N. Putri';return `<div class="incident ${state.selected===i.id?'selected':''}"><div><span class="pill ${i.severity==='Critical'?'red':'amber'}">${i.severity}</span><h4>${i.id} · ${i.title}</h4><p>${i.line} · Model ${i.model}</p><div class="meta" style="margin-top:7px">${i.status} · ${i.age} · ${meta}</div></div><div class="incident-actions"><button class="small-btn" onclick="selectIncident('${i.id}')">${state.selected===i.id?'Selected':'Inspect'}</button></div></div>`}
function selectIncident(id){state.selected=id;log('Incident selected',id);render()}
function seniorKaizenPanel(){if(state.role!=='Senior Engineer')return '';return `<section class="card" style="margin-top:14px"><div class="card-head"><h3>Recurring-problem review</h3><span class="pill amber">P1 simulation</span></div><p class="sub" style="font-size:12px">Sealer pressure instability has appeared 5 times in the last 30 simulated days, meeting the kaizen-review threshold.</p><div class="kv"><span>Repeated cause</span><strong>Pressure regulator drift</strong></div><div class="kv"><span>Suggested next step</span><strong>Open kaizen review</strong></div><div class="actions"><button onclick="escalateKaizen()">Escalate to kaizen</button></div></section>`}
function command(){return `<div class="page-head"><div><h2>Production overview</h2><p class="sub">A decision-support workspace for incident triage, evidence review, corrective actions, and verified knowledge capture.</p></div><button class="primary" onclick="go('incidents')">Review incidents →</button></div>${metrics()}<div class="grid two-col"><section class="card"><div class="card-head"><h3>Priority incidents</h3><small>Updated just now · simulated</small></div>${incidents.map(incidentCard).join('')}<button onclick="go('incidents')">Open incident queue</button></section><section class="card"><div class="card-head"><h3>Workflow status</h3><span class="pill amber">In progress</span></div>${[['1. Triage','Incident and evidence reviewed',true],['2. Diagnosis','Engineer decision pending',state.approved],['3. Corrective action','Action checklist',state.taskChecks.every(Boolean)],['4. Verification','Compare before / after',state.verified],['5. Knowledge capture','Senior validation',state.kbValidated]].map(x=>`<div class="kv"><span>${x[0]}</span><strong class="${x[2]?'up':'warn'}">${x[2]?'Complete':x[1]}</strong></div>`).join('')}<p class="sub" style="font-size:11px;margin-top:12px">This workflow is simulated locally in your browser.</p></section></div>${seniorKaizenPanel()}`}
function operatorIncidentView(){let incident=activeIncident();return `<div class="page-head"><div><h2>Peringatan stasiun</h2><p class="sub">Tampilan operator · hanya insiden di stasiun kerja sendiri. Semua data adalah simulasi lokal.</p></div><span class="pill ${isCriticalIncident()?'red':'amber'}">${incident.severity}</span></div><section class="card"><div class="card-head"><h3>${incident.id} · ${incident.line}</h3><small>Data simulasi</small></div><h2 style="font-size:20px">${incident.title}</h2><div class="note"><strong>Tindakan pertama:</strong> Hentikan penyesuaian manual, konfirmasi kondisi aman sesuai SOP lokal, lalu beri tahu engineer jaga. Jangan mengubah setpoint dari aplikasi ini.</div><div class="kv"><span>Status</span><strong>${state.operatorAck?'Diakui operator':'Perlu diakui'}</strong></div><div class="kv"><span>Engineer jaga</span><strong>R. Pratama · simulasi</strong></div><div class="field" style="margin-top:14px"><label for="operatorNote">Catatan operator (opsional)</label><textarea id="operatorNote" placeholder="Contoh: bunyi tidak normal terdengar pada nozzle..."></textarea></div><div class="actions"><button class="primary" onclick="acknowledge()" ${state.operatorAck?'disabled':''}>Saya sudah melihat peringatan</button><button onclick="escalateOperator()" ${state.operatorEscalated?'disabled':''}>Eskalasikan ke engineer</button></div>${state.operatorEscalated?`<div class="note" style="margin-top:14px">Eskalasi simulasi telah dikirim ke engineer jaga. Tidak ada notifikasi atau sistem produksi nyata yang dihubungi.</div>`:''}</section>`}
function incidentsPage(){if(isOperator())return operatorIncidentView();let incident=activeIncident();return `<div class="page-head"><div><h2>Incident queue</h2><p class="sub">Prioritize incidents, inspect their evidence, and route decisions to the appropriate engineering role.</p></div><span class="pill red">2 active examples</span></div><div class="grid two-col"><section class="card"><div class="card-head"><h3>Active incidents</h3><small>Sorted by severity, then age · simulated</small></div>${incidents.map(incidentCard).join('')}</section><section class="card"><div class="card-head"><h3>Selected incident</h3><span class="pill ${isCriticalIncident()?'red':'amber'}">${incident.severity}</span></div><h2 style="font-size:18px">${incident.id}</h2><p class="sub">${incident.title}</p><div class="kv"><span>Production line</span><strong>${incident.line}</strong></div><div class="kv"><span>Product model / shift</span><strong>${incident.model} · Shift A</strong></div><div class="kv"><span>Signal</span><strong class="critical">${incident.id==='INC-2048'?'Seal thickness 0.42 mm':'Cycle time +12%'}</strong></div><div class="kv"><span>Trigger</span><strong>Spec-limit rule v1.4 · simulated</strong></div><div class="actions"><button class="primary" onclick="go('diagnosis')">Open diagnosis →</button></div></section></div>`}
function diagnosis(){let locked=!roleCapabilities().canDecide;let incident=activeIncident();return `<div class="page-head"><div><h2>Diagnosis workspace</h2><p class="sub">Review evidence and AI-ranked hypotheses. Recommendations are advisory and require human approval.</p></div><span class="pill ${state.approved?'green':'amber'}">${state.approved?'Engineer approved':'Human review required'}</span></div>${simulationNote('No live PLC/MES data, physical control, or actual AI inference is connected.')}<div class="grid two-col"><section class="card"><div class="card-head"><h3>Incident evidence · ${incident.id}</h3><span class="pill ${isCriticalIncident()?'red':'amber'}">${incident.severity}</span></div><div class="grid metrics" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="metric"><div class="label">Seal pressure</div><div class="value">2.61 <small style="font-size:12px">bar</small></div><div class="foot critical">Below target 2.70–3.20</div></div><div class="metric"><div class="label">Defect rate</div><div class="value">4.8<span style="font-size:13px">%</span></div><div class="foot critical">Target below 1.5%</div></div></div><div class="kv"><span>Recent setpoint change</span><strong>None recorded (demo)</strong></div><div class="kv"><span>Sensor confidence</span><strong>High · 0.94</strong></div><div class="kv"><span>Evidence bundle</span><strong>EV-${incident.id.slice(4)}-A</strong></div><h3 style="margin:18px 0 12px">Ranked hypotheses</h3>${[['Low sealing pressure',78,'Pressure trend is below the lower operating threshold.'],['Worn sealing head',54,'Pattern could be consistent with mechanical wear.'],['Material variation',31,'Lot-level variance has not been ruled out.']].map(h=>`<div class="hypothesis"><div class="hyp-title"><span>${h[0]}</span><span class="warn">${h[1]}% confidence</span></div><div class="bar"><span style="width:${h[1]}%"></span></div><p>${h[2]}</p></div>`).join('')}</section><section class="card"><div class="card-head"><h3>Recommended action</h3><span class="pill amber">Advisory</span></div><p style="font-size:13px;font-weight:650">Restore seal pressure to 2.90 bar</p><p class="sub" style="font-size:12px">Suggested setpoint is within the illustrative operating range. A qualified engineer must authorize any real-world adjustment.</p><div class="field"><label for="setpoint">Proposed setpoint (bar)</label><input id="setpoint" type="number" step=".01" min="2.7" max="3.2" value="${state.modified?'2.95':'2.90'}" ${locked?'disabled':''}></div><div class="field"><label for="decisionNote">Decision note ${!locked?'(required for modify / reject)':''}</label><textarea id="decisionNote" placeholder="Add rationale or conditions..." ${locked?'disabled':''}></textarea></div>${locked?`<div class="note">Line Operator can acknowledge and escalate, but cannot approve engineering decisions.</div>`:`<div class="actions"><button class="primary" onclick="approve()">Approve recommendation</button><button onclick="modify()">Modify & approve</button><button class="danger" onclick="reject()">Reject</button></div>`}${state.approved?`<div class="note" style="margin-top:14px">Engineer approval recorded. ${needsSecondApproval()?'Senior Engineer second approval is still required before verification.':'Proceed to action tasks when ready.'}</div>`:''}${roleCapabilities().canSecondApprove&&state.approved&&needsSecondApproval()?`<button class="primary" style="margin-top:10px" onclick="secondApprove()">Grant second approval</button>`:''}<div class="actions"><button onclick="go('tasks')">Go to action tasks →</button></div></section></div>`}
function approve(){if(!roleCapabilities().canDecide)return toast('Line Operator cannot approve this decision.');let v=Number(document.getElementById('setpoint').value);if(v<2.7||v>3.2||!Number.isFinite(v))return toast('Setpoint must be within 2.70–3.20 bar.');state.approved=true;state.modified=false;state.rejected=false;log('Recommendation approved',`Setpoint ${v.toFixed(2)} bar approved by ${state.role}`);render();toast('Approval recorded in demo audit trail.')}
function modify(){if(!roleCapabilities().canDecide)return toast('Line Operator cannot approve this decision.');let note=document.getElementById('decisionNote').value.trim(),v=Number(document.getElementById('setpoint').value);if(!note)return toast('Please add a reason for modifying the recommendation.');if(v<2.7||v>3.2||!Number.isFinite(v))return toast('Setpoint must be within 2.70–3.20 bar.');state.approved=true;state.modified=true;state.rejected=false;log('Recommendation modified',`Setpoint ${v.toFixed(2)} bar; rationale: ${note}`);render();toast('Modified recommendation recorded.')}
function reject(){if(!roleCapabilities().canDecide)return toast('Line Operator cannot reject this decision.');let note=document.getElementById('decisionNote').value.trim();if(!note)return toast('Please add a reason for rejecting the recommendation.');state.rejected=true;state.approved=false;log('Recommendation rejected',note);render();toast('Rejection recorded.')}
function secondApprove(){if(!roleCapabilities().canSecondApprove)return toast('Only Senior Engineer can grant second approval.');if(!state.approved||!isCriticalIncident())return toast('Second approval is only needed after approving a critical incident.');state.secondApproved=true;log('Second approval granted','Critical incident second approval by Senior Engineer.');render();toast('Second approval recorded.')}
function tasks(){let ready=isActionReady();return `<div class="page-head"><div><h2>Action tasks</h2><p class="sub">Track the corrective-action checklist before moving to verification.</p></div><span class="pill ${state.taskChecks.every(Boolean)?'green':'amber'}">${state.taskChecks.filter(Boolean).length} / 4 complete</span></div>${!ready?`<div class="note">Approval gate: ${state.approved?'Critical incident needs Senior Engineer second approval.':'Approve the recommendation in Diagnosis first.'}</div>`:''}<div class="grid two-col"><section class="card"><div class="card-head"><h3>Corrective action checklist</h3><small>${activeIncident().id} · Simulated</small></div><div class="checklist">${[['Confirm station is in safe state','Operator confirms local safety procedure before any adjustment.'],['Inspect sealing head','Check for wear, residue, and alignment.'],['Apply approved setpoint','Qualified personnel apply the authorized setting in a real environment.'],['Run sample and record result','Capture a representative post-action sample.']].map((x,i)=>`<label class="checkrow"><input type="checkbox" ${state.taskChecks[i]?'checked':''} onchange="toggleTask(${i},this.checked)" ${!ready?'disabled':''}><span><strong>${x[0]}</strong><small>${x[1]}</small></span></label>`).join('')}</div><div class="actions"><button class="primary" onclick="go('verification')" ${!isVerificationReady()?'disabled':''}>Continue to verification →</button></div></section><section class="card"><div class="card-head"><h3>Execution guardrails</h3><span class="pill amber">Human-led</span></div><div class="kv"><span>Execution mode</span><strong>Manual / simulated</strong></div><div class="kv"><span>PLC write access</span><strong>Not connected</strong></div><div class="kv"><span>Work order</span><strong>WO-DEMO-8831</strong></div><div class="kv"><span>Required sign-off</span><strong>${isCriticalIncident()&&state.secondApproved?'2 approvals recorded':'Engineering approval'}</strong></div><p class="sub" style="font-size:11px;margin-top:14px">This checklist only changes the local demo state. It does not control equipment or create a real work order.</p></section></div>`}
function toggleTask(i,v){if(!isActionReady())return toast('Required approvals must be completed before updating tasks.');state.taskChecks[i]=v;log('Action checklist updated',`Task ${i+1}: ${v?'complete':'incomplete'}`);render()}
function verification(){let ready=isVerificationReady();return `<div class="page-head"><div><h2>Verification</h2><p class="sub">Compare the illustrative outcome against the acceptance threshold before capturing reusable knowledge.</p></div><span class="pill ${state.verified?'green':'amber'}">${state.verified?'Verified':'Pending verification'}</span></div>${!ready?`<div class="note">Complete required approvals and all action tasks before running verification.</div>`:''}<div class="grid two-col"><section class="card"><div class="card-head"><h3>Before / after comparison</h3><small>Simulated measurements</small></div><div class="grid metrics" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="metric"><div class="label">Before · defect rate</div><div class="value critical">4.8%</div><div class="foot">Baseline sample</div></div><div class="metric"><div class="label">After · defect rate</div><div class="value up">${state.verified?'1.1%':'—'}</div><div class="foot">${state.verified?'Below 1.5% threshold':'Run verification to reveal result'}</div></div></div><div class="kv"><span>Acceptance criterion</span><strong>Defect rate &lt; 1.5%</strong></div><div class="kv"><span>Sample size</span><strong>200 units (illustrative)</strong></div><div class="kv"><span>Result</span><strong class="${state.verified?'up':'warn'}">${state.verified?'Pass':'Not run'}</strong></div><div class="actions"><button class="primary" onclick="runVerification()" ${!ready||state.verified?'disabled':''}>Run simulated verification</button></div></section><section class="card"><div class="card-head"><h3>Verification evidence</h3><span class="pill">${state.verified?'Captured':'Awaiting result'}</span></div>${state.verified?`<div class="kv"><span>Verification ID</span><strong>VER-2048-01</strong></div><div class="kv"><span>Outcome</span><strong class="up">Pass · defect rate 1.1%</strong></div><div class="kv"><span>Change vs baseline</span><strong class="up">−3.7 percentage points</strong></div><p class="sub" style="font-size:12px;margin-top:14px">Illustrative result only. This is not evidence of an actual production improvement.</p><button class="primary" onclick="go('knowledge')">Capture knowledge →</button>`:`<div class="empty">Verification results will appear here after prerequisites are complete.</div>`}</section></div>`}
function runVerification(){if(!isVerificationReady())return toast('Complete required approvals and all action tasks first.');let scenario=document.getElementById('verificationScenario')?.value||'effective';if(scenario==='failed'){state.verified=false;state.verificationFailed=true;state.approved=false;state.secondApproved=false;state.taskChecks=[false,false,false,false];log('Verification not effective','Simulated after-rate remained above the control limit. Failed fix attached as diagnosis evidence; incident returned to Diagnosis.');state.page='diagnosis';render();return toast('Simulated verification failed; incident returned to Diagnosis.')}state.verificationFailed=false;state.verified=true;log('Verification passed','Simulated defect rate reduced from 4.8% to 1.1%; acceptance threshold < 1.5%.');render();toast('Simulated verification passed.')}
function knowledge(){let can=canValidateKnowledge();return `<div class="page-head"><div><h2>Knowledge base</h2><p class="sub">Convert verified incident resolution into a reviewed knowledge article. Drafts are excluded from replay retrieval.</p></div><span class="pill ${state.kbValidated?'green':'amber'}">${state.kbValidated?'Validated':'Draft / review needed'}</span></div>${simulationNote('This article and retrieval outcome are illustrative; they are not connected to a production knowledge system.')}<div class="grid two-col"><section class="card"><div class="card-head"><h3>Knowledge article</h3><span class="pill">KAIZEN-1042</span></div><div class="kb-card"><span class="pill ${state.kbValidated?'green':'amber'}">${state.kbValidated?'Validated':'Draft'}</span><h4>Low seal pressure causing thickness defects</h4><p><strong>Context:</strong> HEV-X · Line 03 · Station A-12</p><p><strong>Symptom:</strong> Seal thickness below specification and elevated defect rate.</p><p><strong>Resolution:</strong> Inspect sealing head, confirm safe state, then apply an engineer-approved pressure setpoint within the validated operating range.</p><p><strong>Verification:</strong> ${state.verified?'Simulated pass · 4.8% → 1.1% defect rate':'Not yet verified'}</p><p><strong>Limitations:</strong> Confirm machine configuration and local work instructions before reuse.</p></div><div class="actions"><button onclick="go('verification')">View verification</button><button class="primary" onclick="validateKnowledge()" ${!can||state.kbValidated?'disabled':''}>${state.kbValidated?'Validated':'Validate article'}</button></div>${!roleCapabilities().canValidateKnowledge?`<p class="sub" style="font-size:11px;margin-top:10px">Only a Senior Engineer can validate this article.</p>`:''}${!state.verified?`<p class="sub" style="font-size:11px;margin-top:10px">Complete verification before this article can be validated.</p>`:''}</section><section class="card"><div class="card-head"><h3>Replay retrieval</h3><span class="pill amber">Controlled</span></div><p class="sub" style="font-size:12px">Simulate whether this article is eligible to be retrieved as prior knowledge for a similar incident.</p><div class="kv"><span>Article status</span><strong>${state.kbValidated?'Validated':'Draft'}</strong></div><div class="kv"><span>Eligible for replay</span><strong class="${state.kbValidated?'up':'critical'}">${state.kbValidated?'Yes':'No'}</strong></div><button style="margin-top:14px" onclick="replay()">Test retrieval eligibility</button><div id="replayResult" class="${state.replayed?'':'hidden'} note" style="margin-top:12px">${state.kbValidated?'Eligible: validated knowledge article returned for a simulated similar incident.':'Not eligible: draft or unvalidated knowledge is excluded from retrieval.'}</div></section></div>`}
function validateKnowledge(){if(!roleCapabilities().canValidateKnowledge)return toast('Only Senior Engineer can validate knowledge.');if(!state.verified)return toast('Verification is required first.');state.kbValidated=true;log('Knowledge article validated','KAIZEN-1042 validated by Senior Engineer.');render();toast('Knowledge article validated in demo.')}
function replay(){state.replayed=true;state.replayInjected=state.kbValidated;log('Replay retrieval tested',state.kbValidated?'Simulator injected the same pattern; KAIZEN-1042 returned as top similar case.':'Draft excluded from retrieval.');render();toast(state.kbValidated?'Simulated repeat incident retrieved KAIZEN-1042.':'Draft excluded from replay retrieval.')}
function escalateOperator(){let note=document.getElementById('operatorNote')?.value.trim()||'No note added';state.operatorNote=note;state.operatorEscalated=true;log('Operator escalation sent',`${state.selected}; note: ${note}`);render();toast('Simulated escalation recorded.')}
function acknowledge(){state.operatorAck=true;log('Operator acknowledged incident',state.selected);render();toast('Incident acknowledged.')}
function audit(){return `<div class="page-head"><div><h2>Audit trail</h2><p class="sub">Chronological record of decisions and workflow changes made during this browser session.</p></div><button onclick="exportAudit()">Export JSON</button></div><div class="note">Demo audit only. Entries are stored in browser memory and are not durable, cryptographically signed, or append-only across sessions.</div><section class="card"><div class="card-head"><h3>Activity log</h3><small>${state.events.length} events</small></div><div class="timeline">${state.events.map(e=>`<div class="event"><time>${e[0]}</time><div><strong>${e[1]}</strong><p>${e[2]}</p></div></div>`).join('')}</div></section>`}
function exportAudit(){const blob=new Blob([JSON.stringify(state.events.map(e=>({time:e[0],event:e[1],details:e[2]})),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='manufacturing-copilot-demo-audit.json';a.click();URL.revokeObjectURL(a.href);toast('Audit JSON exported.')}
function render(){applyRoleNavigation();const v=document.getElementById('view');const pages={command,incidents:incidentsPage,diagnosis,tasks,verification,knowledge,audit};v.innerHTML=pages[state.page]();renderDiagnosisEnhancements();renderRecommendationDetails();renderTaskMetadata();renderVerificationControls();renderFailedFixEvidence();renderReplayInjection();renderIncidentState();localizeInterface()}
render();
</script>
</body>
</html>
